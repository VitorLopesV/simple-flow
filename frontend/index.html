<!doctype html>
<html lang="pt-BR" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/simple-flow-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sistema de controle financeiro pessoal: entradas, saídas e cartões de crédito." />
    <meta name="theme-color" content="#0f172a" />
    <title>SimpleFlow</title>
    <script>
      // Aplica o tema antes da primeira pintura para evitar flash de conteúdo claro.
      ;(() => {
        try {
          const saved = localStorage.getItem('fc:theme')
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          if (saved === 'dark' || (saved !== 'light' && prefersDark)) {
            document.documentElement.classList.add('dark')
          }
        } catch {
          /* localStorage indisponível: segue no tema claro */
        }
      })()
    </script>
  </head>
  <body class="h-full">
    <div id="app" class="h-full"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
